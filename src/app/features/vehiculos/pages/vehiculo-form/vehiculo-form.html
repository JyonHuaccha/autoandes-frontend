<div class="page-heading">
  <div>
    <p class="eyebrow">Mantenimiento</p>
    <h1>{{ id ? 'Editar' : 'Nuevo' }} vehículo</h1>
  </div>
  <a class="button secondary" routerLink="/vehiculos">Volver</a>
</div>
@if (error()) {
  <p class="alert error" role="alert">{{ error() }}</p>
}
@if (cargando()) {
  <p role="status">Cargando registro…</p>
}
<form [formGroup]="form" (ngSubmit)="guardar()" class="card form-grid">
  <fieldset [disabled]="cargando() || guardando()">
    <label>
      Placa
      <input type="text" formControlName="placa" />
      <app-error-campo
        [control]="form.controls.placa"
        [servidor]="campos()['placa']"
        mensaje="ABC-123"
      />
    </label>
    <label>
      Marca
      <input type="text" formControlName="marca" />
      <app-error-campo
        [control]="form.controls.marca"
        [servidor]="campos()['marca']"
        mensaje="Marca obligatoria, máximo 40 caracteres"
      />
    </label>
    <label>
      Modelo
      <input type="text" formControlName="modelo" />
      <app-error-campo
        [control]="form.controls.modelo"
        [servidor]="campos()['modelo']"
        mensaje="Modelo obligatorio, máximo 40 caracteres"
      />
    </label>
    <label>
      Año
      <input type="number" formControlName="anio" />
      <app-error-campo
        [control]="form.controls.anio"
        [servidor]="campos()['anio']"
        mensaje="De 1990 a 2027"
      />
    </label>
    <label>
      Cliente
      <select formControlName="clienteId">
        <option [ngValue]="0">Seleccione un cliente</option>
        @for (c of clientes(); track c.id) {
          <option [ngValue]="c.id">{{ c.nombres }} — {{ c.documento }}</option>
        }
      </select>
      <app-error-campo
        [control]="form.controls.clienteId"
        [servidor]="campos()['clienteId']"
        mensaje="Seleccione un cliente"
      />
    </label>
    <div class="form-actions">
      <button type="submit" [disabled]="guardando() || cargando()">
        {{ guardando() ? 'Guardando…' : 'Guardar' }}
      </button>
      <a class="button secondary" routerLink="/vehiculos">Cancelar</a>
    </div>
  </fieldset>
</form>

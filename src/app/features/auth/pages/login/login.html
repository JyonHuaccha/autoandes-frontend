<div class="login-page">
  <form class="login-card" [formGroup]="form" (ngSubmit)="ingresar()">
    <p class="login-brand">AutoAndes</p>
    <h1>Iniciar sesión</h1>
    @if (route.snapshot.queryParamMap.has('expirada')) {
      <p class="alert warning">Su sesión expiró. Inicie sesión nuevamente.</p>
    }
    @if (error()) {
      <p class="alert error" role="alert">{{ error() }}</p>
    }
    <label>
      Usuario
      <input autocomplete="username" formControlName="username" />
      <app-error-campo
        [control]="form.controls.username"
        [servidor]="campos()['username']"
        mensaje="Ingrese su usuario"
      />
    </label>
    <label>
      Contraseña
      <input
        [type]="verClave() ? 'text' : 'password'"
        autocomplete="current-password"
        formControlName="password"
      />
      <app-error-campo
        [control]="form.controls.password"
        [servidor]="campos()['password']"
        mensaje="Ingrese su contraseña"
      />
    </label>
    <label class="checkbox">
      <input type="checkbox" [checked]="verClave()" (change)="verClave.set(!verClave())" />
      Mostrar contraseña
    </label>
    <button type="submit" [disabled]="enviando()">
      {{ enviando() ? 'Ingresando…' : 'Ingresar' }}
    </button>
  </form>
</div>
